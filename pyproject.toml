[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encorp-payroll"
version = "1.0.0"
description = "Local server package for the Encorp salary portal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
	"pythonnet>=3.0,<4",
	"reportlab>=4.4,<5"
]

[project.scripts]
encorp-server = "encorp_app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["encorp_app*"]

[tool.setuptools.package-data]
encorp_app = ["static/*", "static/vendor/*"]
